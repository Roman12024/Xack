version: "3.9"

# Основной профиль: CRM-сервис + БД-файл в volume.
# Профиль "sso" добавляет Keycloak для соответствия требованию ТЗ
# о едином входе (SSO). CRM в демо-режиме использует встроенную JWT-авторизацию;
# для переключения на Keycloak замените проверку токена в app/security.py
# на верификацию JWT от Keycloak (realm public key).

services:
  crm:
    build: .
    ports:
      - "8000:8000"
    environment:
      RTK_SECRET: ${RTK_SECRET:-change-me-in-production}
    volumes:
      - crm-data:/srv/app/data
    restart: unless-stopped

  # Поднимается командой: docker compose --profile sso up -d
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    profiles: ["sso"]
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  crm-data:
